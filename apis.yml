aid: agvend
name: Agvend
description: >-
  AgVend is an agricultural technology company founded in 2017 (Austin, TX) that
  provides digital engagement and commerce software to agricultural retailers,
  cooperatives, manufacturers, and distributors. Its white-labeled Grower Portal
  (web and mobile) gives ag retailers a branded storefront, CRM, sales enablement,
  digital billing, and integrated payments, while its Nexus product extends the
  platform to manufacturers and distributors across the ag supply chain. The
  platform integrates with major ag and energy ERPs, agronomy planning tools, and
  grain and financing systems, and exposes an API Access Driver that lets customers
  pull structured platform data into external reporting and BI tools such as Power
  BI. Backed by 8vc and Tidemark.
